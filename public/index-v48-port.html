  <style>
    :root{
      --red:#d91633; --red2:#b90f29; --red3:#ff6b7f; --rose:#fff4f6; --rose2:#ffe7eb;
      --orange:#ff9f1c; --yellow:#ffd166; --green:#20b45a; --blue:#2878ff; --purple:#8b5cf6;
      --text:#171923; --muted:#667085; --line:#f1d7dc; --bg:#fff9fa; --card:#fff;
      --shadow:0 16px 40px rgba(185,15,41,.10); --shadow2:0 22px 65px rgba(125,16,34,.16); --radius:24px;
      --ease:cubic-bezier(.2,.8,.2,1); --sidebar:292px;
    }
    *{box-sizing:border-box} html,body{height:100%} html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#fff8f9 0%,#fff 42%,#fff0f3 100%);overflow-x:hidden}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    ::selection{background:#ffd5dc;color:#8b0015}
    .login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:radial-gradient(circle at 15% 20%,#ffe1e7 0 18%,transparent 36%),linear-gradient(135deg,#fffafa,#fff 45%,#fff2f5)}
    .loginHero{position:relative;overflow:hidden;padding:56px;display:flex;flex-direction:column;justify-content:space-between}.loginHero:before{content:"";position:absolute;inset:-35%;background:conic-gradient(from 100deg,rgba(217,22,51,.16),rgba(255,159,28,.14),rgba(40,120,255,.10),rgba(217,22,51,.16));animation:spinSlow 16s linear infinite}.loginHero>*{position:relative}.loginHero img{width:320px;max-width:82%;filter:drop-shadow(0 18px 32px rgba(217,22,51,.14))}.loginHero h1{font-size:52px;line-height:1;margin:26px 0 12px;letter-spacing:-1.7px}.loginHero p{font-size:18px;color:#5d6675;max-width:590px}.loginCard{margin:auto;width:min(480px,88%);background:rgba(255,255,255,.84);backdrop-filter:blur(24px);border:1px solid rgba(255,214,220,.85);border-radius:32px;box-shadow:var(--shadow2);padding:32px;animation:popIn .65s var(--ease) both}.loginCard h2{font-size:30px;margin:0 0 8px}.loginCard label{display:grid;gap:8px;font-weight:850;margin:16px 0}.quickUsers{display:grid;gap:8px;margin-top:16px}.quickUsers button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px;text-align:left;font-weight:850}.quickUsers button:hover{border-color:#ffc2cc;background:#fff6f8;transform:translateY(-2px)}
    .app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr}.sidebar{background:rgba(255,255,255,.86);backdrop-filter:blur(24px);border-right:1px solid var(--line);padding:18px 16px;position:sticky;top:0;height:100vh;overflow:auto;box-shadow:12px 0 40px rgba(185,15,41,.05);z-index:20}.logoBox{height:132px;display:flex;align-items:center;justify-content:center;margin-bottom:15px;border-radius:26px;background:#fff;box-shadow:0 14px 35px rgba(185,15,41,.09);overflow:hidden}.logoBox img{width:100%;max-width:360px;max-height:122px;object-fit:contain;mix-blend-mode:multiply}.roleChip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 12px;background:#fff2f5;border:1px solid #ffd6de;color:#a40d25;font-weight:900;font-size:12px;margin:0 0 10px 4px}
    .nav{position:relative}.nav button{width:100%;display:flex;align-items:center;gap:13px;border:0;background:transparent;padding:13px 14px;border-radius:18px;color:#31343b;text-align:left;margin:5px 0;font-weight:850;font-size:15px;transition:transform .25s var(--ease), background .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease)}.nav button:hover{background:#fff;transform:translateX(4px);box-shadow:0 10px 24px rgba(185,15,41,.08)}.nav button.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 14px 26px rgba(185,15,41,.24);transform:translateX(3px)}.nav .ico{width:30px;height:30px;border-radius:12px;background:#fff2f5;display:grid;place-items:center;color:var(--red);font-size:17px;transition:.25s var(--ease)}.nav button.active .ico{background:rgba(255,255,255,.22);color:#fff;transform:rotate(-4deg) scale(1.05)}.drawerOverlay{display:none}
    .topbar{height:76px;background:rgba(255,255,255,.78);backdrop-filter:blur(22px);border-bottom:1px solid rgba(241,215,220,.75);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}.hamb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--red);font-size:21px;display:none}.topbarLeft{display:flex;align-items:center;gap:12px}.mobileBrand{display:none;font-weight:1000;color:var(--red)}.userpill{display:flex;align-items:center;gap:12px}.avatar{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,#ffe4e9,#fff);display:grid;place-items:center;font-size:24px;box-shadow:0 8px 18px rgba(185,15,41,.08)}.logout{border:0;background:transparent;color:var(--muted);font-weight:850}.notifBtn{position:relative;border:0;background:#fff;border-radius:16px;width:48px;height:48px;box-shadow:0 10px 24px rgba(0,0,0,.07);display:grid;place-items:center;transition:.25s var(--ease)}.notifBtn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(185,15,41,.12)}.notifIcon{font-size:22px;display:inline-block}.notifBtn.hasUnread .notifIcon{animation:bellRing 2.2s ease-in-out infinite}.badge{position:absolute;right:-5px;top:-5px;background:linear-gradient(135deg,#ff3b5c,var(--red2));color:#fff;border:2px solid #fff;border-radius:999px;font-size:11px;font-weight:1000;min-width:22px;height:22px;display:grid;place-items:center;box-shadow:0 8px 18px rgba(217,22,51,.28)}.notifDrop{position:absolute;right:18px;top:66px;width:380px;max-width:calc(100vw - 36px);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow2);padding:14px;display:none;transform-origin:top right;animation:dropIn .22s var(--ease) both;z-index:50}.notifDrop.show{display:block}.notifItem{display:flex;gap:12px;padding:12px;border-radius:18px;animation:fadeUp .32s var(--ease) both}.notifItem:hover{background:#fff6f7}.notifItem .nIcon{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:#fff0f3;color:var(--red);font-size:18px;flex:0 0 auto}.notifItem b{display:block}.notifItem small{color:var(--muted)}
    .content{padding:28px;max-width:1540px;width:100%;margin:0 auto}.page{animation:pageEnter .45s var(--ease) both}.topProgress{height:3px;background:linear-gradient(90deg,var(--red),var(--orange),var(--red));background-size:220% 100%;position:fixed;top:0;left:0;width:0;z-index:200;box-shadow:0 0 18px rgba(217,22,51,.45)}.topProgress.go{animation:progressBar .48s var(--ease) both}

    function wrapCanvasLines(ctx,text,maxWidth){
      const paragraphs=String(text||'').split(/\n/); const lines=[];
      paragraphs.forEach(p=>{
        const words=String(p).split(/\s+/).filter(Boolean);
        if(!words.length){lines.push(''); return}
        let line='';
        words.forEach(word=>{
          const test=line?line+' '+word:word;
          if(ctx.measureText(test).width>maxWidth && line){lines.push(line); line=word}else line=test;
        });
        if(line) lines.push(line);
      });
      return lines;
    }
    function drawCanvasText(ctx,text,x,y,maxWidth,lineHeight,color='#1f2937',font='28px Arial',maxLines=99){
      ctx.fillStyle=color; ctx.font=font;
      const lines=wrapCanvasLines(ctx,text,maxWidth).slice(0,maxLines);
      lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));
      return y + lines.length*lineHeight;
    }
    function roundedRectPath(ctx,x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
      ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
    }
    function fillRoundRect(ctx,x,y,w,h,r,fill,stroke=''){ roundedRectPath(ctx,x,y,w,h,r); if(fill){ctx.fillStyle=fill; ctx.fill()} if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke()} }

      return `<div class="childSwitch"><b>Chọn học sinh:</b>${kids.map(k=>`<button class="childTab ${k.id===selected?'active':''}" onclick="setParentChild('${k.id}')">${k.name}<span class="mini"> • ${k.className}</span></button>`).join('')}</div>`;
    }
    function gradeSortValue(className){const g=gradeOfClassName(className); if(g==='K') return -1; const n=parseInt(g,10); return Number.isFinite(n)?n:99}

    function sortBillingRows(rows){return [...rows].sort((a,b)=>String(a.className).localeCompare(String(b.className),'vi',{numeric:true})||String(a.student.name).localeCompare(String(b.student.name),'vi'))}
    function groupBillingRowsByClass(rows){
      const map=new Map();
      sortBillingRows(rows).forEach(r=>{if(!map.has(r.className)) map.set(r.className,[]); map.get(r.className).push(r)});
      return [...map.entries()].map(([className,items])=>({className,items,total:items.reduce((s,r)=>s+r.amount,0),paid:items.filter(r=>r.paid).length,sent:items.filter(r=>isTuitionMessageSent(r.student.id)).length}));
    }

    function zeroFeeRow(){return {present:0,late:0,makeup:0,absent:0,excused:0,billable:0,currentAmount:0,previousDebt:0,amount:0,arrearsMonths:[]}}
    function feeRowForStudent(st){
      const month=tuitionMonthKey();
      const rollupLoaded=db.tuitionRollupMonth===month;
      const api=(db.tuitionRollup||{})[st.id];

      if(rollupLoaded){
        if(api){
          const a={present:Number(api.present||0),late:Number(api.late||0),makeup:Number(api.makeup||0),absent:Number(api.absent||0),excused:Number(api.excused||0)};
          const billable=Number(api.billable ?? (a.present+a.late+a.makeup));
          const currentAmount=Number(api.currentAmount ?? (billable*(db.settings.unitPrice||70000)));
          const previousDebt=Number(api.previousDebt||0);
          const amount=Number(api.amount ?? (currentAmount+previousDebt));
          return {...a,billable,currentAmount,previousDebt,arrearsMonths:api.arrearsMonths||[],amount,paid:isPaid(st.id)}
        }
        return {...zeroFeeRow(),paid:isPaid(st.id)}
      }

      const rolled=rollupAttendanceFromSessions(st.id);
      const hasSessionData=Object.values(ensureAttendanceSessions()).some(rec=>rec.saved && Object.values(rec.rows||{}).some(r=>r.studentId===st.id));
      if(!hasSessionData) return {...zeroFeeRow(),paid:isPaid(st.id)}
      const a={present:Number(rolled.present||0),late:Number(rolled.late||0),makeup:Number(rolled.makeup||0),absent:Number(rolled.absent||0),excused:Number(rolled.excused||0)};
      const billable=a.present+a.late+a.makeup;
      const currentAmount=billable*(db.settings.unitPrice||70000);
      return {...a,billable,currentAmount,previousDebt:0,arrearsMonths:[],amount:currentAmount,paid:isPaid(st.id)}
    }

    function gradeOfClassName(name){
      const cleaned=(name||'').trim();
      let m=cleaned.match(/^G\s*(\d+)\s*\./i);
      if(m) return m[1];
      m=cleaned.match(/^(\d+)\s*\./);
      if(m) return m[1];
      if(/^GK/i.test(cleaned)) return 'K';
      return null;
    }

    function classGradeLabel(name){const g=gradeOfClassName(name); return g==='K'?'Khối K':g?`Khối ${g}`:'Khối khác'}
    function gradeOrderValue(name){const g=gradeOfClassName(name); if(g==='K') return 0; const n=parseInt(g,10); return Number.isFinite(n)?n:99}
    function classNumberValue(name){const m=String(name||'').match(/(?:G\s*)?\d+\s*\.\s*(\d+)/i); return m?parseInt(m[1],10):0}
    function sortClassesByGrade(rows){return [...rows].sort((a,b)=>gradeOrderValue(a.name)-gradeOrderValue(b.name)||classNumberValue(a.name)-classNumberValue(b.name)||String(a.name).localeCompare(String(b.name),'vi',{numeric:true}))}
    function groupClassesByGrade(rows){const map=new Map(); sortClassesByGrade(rows).forEach(c=>{const k=classGradeLabel(c.name); if(!map.has(k)) map.set(k,[]); map.get(k).push(c)}); return [...map.entries()].map(([grade,items])=>({grade,items}))}
    function classGroupsMarkup(rows){const groups=groupClassesByGrade(rows); return groups.length?groups.map((g,gi)=>`<section class="gradeGroup" style="--i:${gi}"><div class="gradeHeader"><h2>${g.grade}</h2><span class="pill blue">${g.items.length} lớp</span></div><div class="gradeClassGrid">${g.items.map((c,i)=>`<div onclick="openClassDetail('${c.id}')">${classCard(c,i)}</div>`).join('')}</div></section>`).join(''):'<div class="empty">Không tìm thấy lớp.</div>'}
    function classSectionsMarkup(rows){
      const active=sortClassesByGrade(rows.filter(c=>c.status!=='ended'));
      const ended=sortClassesByGrade(rows.filter(c=>c.status==='ended'));
      return `<section class="classSection"><div class="classSectionHead"><h2>Lớp đang học</h2><span class="pill green">${active.length} lớp</span></div>${classGroupsMarkup(active)}</section><section class="classSection archivedClassBlock"><div class="classSectionHead"><h2>Lớp đã học</h2><span class="pill gray">${ended.length} lớp</span></div>${classGroupsMarkup(ended)}</section>`;
    }
    function sameGradeDifferentClass(sourceClassId,targetClassId){
      const s=classById(sourceClassId), t=classById(targetClassId);
      const sg=gradeOfClassName(s.name), tg=gradeOfClassName(t.name);
      return !!sg && sg===tg && sourceClassId!==targetClassId;
    }
    function absentCandidatesForTarget(targetClassId){
      const target=classById(targetClassId); const tg=gradeOfClassName(target.name);

      return db.attendance

    function sessionObjectFromKey(key){
      if(!key) return null;
      const parts=String(key).split('|');
      let classId,date,day,slot;
      if(parts.length>=4){[classId,date,day,slot]=parts}else{[classId,day,slot]=parts; date=isoDate(dayDateFor(day))}
      const [start,end] = String(slot||'').split('-');
      const c=classById(classId);
      if(!c?.id || !day || !start || !end) return null;
      return {classId, className:c.name, teacher:c.teacher, ta:c.ta, students:c.students?.length||0, day, date, start, end, slot, raw:c.time};
    }



    function absentCountForSession(sessionKey){
      const s=sessionObjectFromKey(sessionKey); if(!s) return 0;
      const st=sessionStatus(s); if(st.key!=='done') return 0;
      return absenteesForSession(sessionKey).length;
    }


    function absenteesForSession(sessionKey){
      const s=sessionObjectFromKey(sessionKey); if(!s) return [];
      const c=classById(s.classId);
      ensureAbsenceRecords();

      // 1) Nếu buổi này đã điểm danh thật, lấy đúng học sinh vắng trong bản điểm danh đó.
      const rec=ensureAttendanceSessions()[attendanceKey(sessionKey)];
      if(rec?.saved){
        const roster=rosterForAttendance(s.classId,sessionKey);
        return roster.filter(x=>x.type==='official' && rec.rows[`official_${x.student.id}`]?.status==='absent')
          .map(x=>({
            record:{id:absenceId(x.student.id,sessionKey),reason:rec.rows[`official_${x.student.id}`]?.note||'Vắng'},
            student:x.student,
            sourceClass:c,
            sourceSessionKey:sessionKey,
            reason:rec.rows[`official_${x.student.id}`]?.note||'Vắng'
          }));
      }

      // 2) Nếu là dữ liệu, lấy đúng record theo sessionKey = lớp + ngày + giờ.
      const fromRecords=db.absenceRecords.filter(a=>a.sourceSessionKey===sessionKey);
      return fromRecords.map(a=>({
        record:a,
        student:studentById(a.studentId),
        sourceClass:c,
        sourceSessionKey:sessionKey,

      ${rows.length?`<div class="modalTableWrap"><table class="modalTable"><thead><tr><th>STT</th><th>Học sinh</th><th>Lớp</th><th>Ghi chú</th><th>Trạng thái</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.student.name}</b></td><td>${x.sourceClass.name}</td><td>${x.reason||'Vắng'}</td><td>${x.record?.id && absenceRecordStatus(x.record.id)==='scheduled'?'<span class="makeupBadge">Đã xếp học bù</span>':'<span class="unpaidBadge">Chờ xếp</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Buổi này không có học sinh vắng.</div>'}`)

    }
    function evalAverage(ev){
      if(!ev||!ev.scores) return 0;
      const vals=Object.values(ev.scores).map(Number).filter(n=>Number.isFinite(n)); return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length:0;

      normalizeMakeupPlans();

      if(!rows.length) return compact?'':'<div class="empty">Chưa có học sinh học bù trong lớp/buổi này.</div>';

      return `<div class="modalTableWrap"><table class="modalTable"><thead><tr><th>STT</th><th>Học sinh</th><th>Lớp chính</th><th>Buổi học bù</th><th>Trạng thái</th><th>Xếp lúc</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.student.name}</b></td><td>${x.sourceClass.name}</td><td>${x.plan.targetSessionKey?sessionLabelFromKey(x.plan.targetSessionKey):'Tổng lớp'}</td><td><span class="makeupBadge">Học bù</span></td><td>${x.plan.createdAt||'-'}</td></tr>`).join('')}</tbody></table></div>`;

    function sessionKeyFor(s,weekStart=weekStartDate()){
      const date=s.date || isoDate(dayDateForWeek(s.day,weekStart));
      return `${s.classId}|${date}|${s.day}|${s.start}-${s.end}`;
    }
    function sessionLabelFromKey(key){
      if(!key) return 'Tất cả buổi';
      const parts=String(key).split('|');
      let classId,date,day,slot;
      if(parts.length>=4){[classId,date,day,slot]=parts}else{[classId,day,slot]=parts; date=isoDate(dayDateFor(day))}
      return `${dayNameFromKey(day)||day} ${date?formatVNDate(parseISODate(date)):''} • ${(slot||'').replace('-', ' - ')}`;
    }

    function classSessionKeyAtWeek(classId,sessionIndex,weekStart){
      const c=classById(classId); const sessions=parseClassSessions(c); const s=sessions[sessionIndex % sessions.length];
      return sessionKeyFor(s,weekStart);
    }




    function plannedMakeupsForSession(sessionKey){
      db.makeupPlans ||= [];
      normalizeMakeupPlans();
      return db.makeupPlans.filter(p=>p.targetSessionKey===sessionKey && p.status!=='cancelled');
    }


    function normalizeMakeupPlans(){
      db.makeupPlans ||= [];
      db.makeupPlans = db.makeupPlans.map(p=>{
        if(p.targetSessionKey) return p;
        return {...p, targetSessionKey:null, legacyClassWide:true};
      });
    }

    function absenceId(studentId,sourceSessionKey){return `${sourceSessionKey}__${studentId}`}


    function ensureAbsenceRecords(){
      db.absenceRecords ||= [];
      return db.absenceRecords;
    }

    function absenceRecordStatus(absenceIdValue){
      const plan=(db.makeupPlans||[]).find(p=>p.absenceId===absenceIdValue && p.status!=='cancelled');
      return plan?'scheduled':'pending';
    }



    function pendingAbsenceCandidates(targetClassId,targetSessionKey){
      normalizeMakeupPlans();
      const target=classById(targetClassId); const tg=gradeOfClassName(target.name);
      const targetSession=sessionObjectFromKey(targetSessionKey);
      if(!tg || !targetSession) return [];
      const targetStart=dateTimeForSession(targetSession,'start');
      const alreadyInTarget=new Set(plannedMakeupsForSession(targetSessionKey).map(p=>p.studentId));
      let rows = ensureAbsenceRecords()
        .filter(a=>absenceRecordStatus(a.id)==='pending')
        .map(a=>({record:a, student:studentById(a.studentId), sourceClass:classById(a.sourceClassId), sourceSession:sessionObjectFromKey(a.sourceSessionKey)}))
        .filter(x=>x.student?.id && x.sourceClass?.id && x.sourceSession)
        .filter(x=>!alreadyInTarget.has(x.student.id))
        .filter(x=>x.sourceClass.id!==targetClassId && gradeOfClassName(x.sourceClass.name)===tg)
        .filter(x=>dateTimeForSession(x.sourceSession,'end') < targetStart)
        .sort((a,b)=>dateTimeForSession(a.sourceSession,'end')-dateTimeForSession(b.sourceSession,'end') || a.student.name.localeCompare(b.student.name,'vi'));
      const remaining=Math.max(0,(db.settings.capacity||15)-totalRosterCountForSession(targetClassId,targetSessionKey));
      return rows.slice(0,remaining || rows.length);
    }

    async function cancelMakeupPlan(planId,targetClassId,targetSessionKey){
      const p=(db.makeupPlans||[]).find(x=>x.id===planId);
      if(!p){toast('Không tìm thấy lịch học bù');return}
      try{
        await officialFetch(`/api/makeup/plans/${encodeURIComponent(planId)}`,{method:'DELETE'});
        p.status='cancelled'; p.cancelledAt=new Date().toLocaleString('vi-VN');
        const rec=(db.absenceRecords||[]).find(a=>a.id===p.absenceId); if(rec) rec.status='pending';
        save(); toast('Đã hủy học bù, học sinh quay lại danh sách chờ xếp'); openScheduleMakeup(targetClassId,targetSessionKey);
      }catch(e){toast(e.message||'Không hủy được học bù')}
    }


    function attendanceKey(sessionKey){return `att_${sessionKey}`}
    function ensureAttendanceSessions(){db.attendanceSessions ||= {}; return db.attendanceSessions}

    function sessionDateEndOfDay(s){const d=s.date?parseISODate(s.date):dayDateFor(s.day); d.setHours(23,59,59,999); return d}


    function attendanceWindowInfo(sessionKey){
      const s=sessionObjectFromKey(sessionKey); if(!s) return {open:false,label:'Không xác định buổi học'};
      if(isSessionCancelled(sessionKey)) return {open:false,label:'Buổi học đã nghỉ',session:s};
      const openAt=dateTimeForSession(s,'start'); openAt.setMinutes(openAt.getMinutes()-15);
      const closeAt=sessionDateEndOfDay(s);
      const now=new Date();
      return {open:now>=openAt && now<=closeAt, openAt, closeAt, now, session:s, label:`Mở ${openAt.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})} - 23:59`};
    }

    function rosterForAttendance(classId,sessionKey){
      normalizeMakeupPlans();
      const c=classById(classId);
      const official=(c.students||[]).map(s=>({student:{...s,classId:c.id,className:c.name}, type:'official', sourceClass:c, plan:null}));
      const makeup=makeupStudentsForSession(sessionKey).map(x=>({student:{...x.student,classId:x.sourceClass.id,className:x.sourceClass.name}, type:'makeup', sourceClass:x.sourceClass, plan:x.plan}));
      const manual=(ensureAttendanceSessions()[attendanceKey(sessionKey)]?.manualMakeups||[]).map(m=>({student:m.student, type:'manual_makeup', sourceClass:classById(m.sourceClassId)||{}, plan:m}));
      const ids=new Set();
      return [...official,...makeup,...manual].filter(x=>{const k=`${x.type}_${x.student.id}`; if(ids.has(k)) return false; ids.add(k); return true});
    }
    function attendanceRecord(sessionKey){
      const store=ensureAttendanceSessions(); const key=attendanceKey(sessionKey);
      store[key] ||= {sessionKey, saved:false, editable:true, rows:{}, manualMakeups:[], updatedAt:null};
      return store[key];
    }

    function manualMakeupsForSession(sessionKey){

    function syncAbsenceRecordsForAttendance(sessionKey){
      const s=sessionObjectFromKey(sessionKey); if(!s) return;
      const c=classById(s.classId); const rec=ensureAttendanceSessions()[attendanceKey(sessionKey)];
      if(!rec?.saved) return;
      db.absenceRecords ||= [];
      const existingById=new Map(db.absenceRecords.filter(a=>a.sourceSessionKey===sessionKey).map(a=>[a.id,a]));
      const generated=[];
      const roster=rosterForAttendance(s.classId,sessionKey).filter(x=>x.type==='official');
      roster.forEach(x=>{
        const row=rec.rows[`official_${x.student.id}`];
        if(row?.status==='absent'){
          const id=absenceId(x.student.id,sessionKey);
          const old=existingById.get(id)||{};
          generated.push({
            id,
            studentId:x.student.id,
            sourceClassId:c.id,
            sourceSessionKey:sessionKey,
            sourceSessionLabel:sessionLabelFromKey(sessionKey),
            reason:row.note||old.reason||'Vắng',
            generatedFromAttendance:true,
            createdAt:old.createdAt||new Date().toLocaleString('vi-VN')
          });
        }
      });
      db.absenceRecords = db.absenceRecords.filter(a=>a.sourceSessionKey!==sessionKey || absenceRecordStatus(a.id)==='scheduled');
      const generatedIds=new Set(generated.map(a=>a.id));
      db.absenceRecords = db.absenceRecords.filter(a=>!(generatedIds.has(a.id) && a.sourceSessionKey===sessionKey));
      db.absenceRecords.push(...generated);
    }

    function rollupAttendanceFromSessions(studentId){
      const rows=Object.values(ensureAttendanceSessions()).flatMap(rec=>Object.values(rec.rows||{}).filter(r=>r.studentId===studentId && rec.saved));
      const present=rows.filter(r=>r.status==='present' && r.type==='official').length;
      const late=rows.filter(r=>r.status==='late' && r.type==='official').length;
      const absent=rows.filter(r=>r.status==='absent' && r.type==='official').length;
      const makeup=rows.filter(r=>(r.type==='makeup'||r.type==='manual_makeup') && (r.status==='present'||r.status==='late')).length;
      return {present,late,absent,excused:0,makeup};
    }

    function evaluationKeyFor(studentId,monthKey=evaluationMonthKey()){return `${studentId}__${monthKey}`}
    function normalizeEvaluationMonthValue(v){
      const s=String(v||'');
      if(/^\d{4}-\d{2}$/.test(s)) return s;
      const m=s.match(/^(\d{2})\/(\d{4})$/);
      return m?`${m[2]}-${m[1]}`:evaluationMonthKey();
    }
    function ensureEvaluation(studentId){
      db.evaluations ||= [];
      const monthKey=evaluationMonthKey();
      let ev=db.evaluations.find(e=>e.studentId===studentId && normalizeEvaluationMonthValue(e.monthKey||e.month)===monthKey);
      const st=studentById(studentId);
      if(!ev){
        ev={studentId,classId:st.classId,monthKey,month:monthKey,scores:{Listening:3,Speaking:3,Reading:3,Writing:3,Vocabulary:3,Participation:3,Homework:3},status:'draft',comment:'',strengths:'',improvements:'',suggestion:''};
        db.evaluations.push(ev);
      }
      ev.monthKey ||= normalizeEvaluationMonthValue(ev.month);
      ev.month = ev.monthKey;
      ev.scores ||= {Listening:3,Speaking:3,Reading:3,Writing:3,Vocabulary:3,Participation:3,Homework:3};
      ['Listening','Speaking','Reading','Writing','Vocabulary','Participation','Homework'].forEach(k=>{ev.scores[k]=Math.max(1,Math.min(5,Number(ev.scores[k]||3)))});
      ev.strengths ??= '';
      ev.improvements ??= '';
      ev.suggestion ??= '';
      ev.comment ??= '';
      return ev;
    }
    function h(v){return String(v??'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]))}

    const WEEK_DAYS = [
      {key:'Mon', label:'Thứ 2'},
      {key:'Tue', label:'Thứ 3'},
      {key:'Wed', label:'Thứ 4'},
      {key:'Thu', label:'Thứ 5'},
      {key:'Fri', label:'Thứ 6'},
      {key:'Sat', label:'Thứ 7'},
      {key:'Sun', label:'Chủ nhật'}
    ];
    const DAY_ALIASES = [
      ['Thu', /\b(thu|thur|thurs|thursday)\b/ig],
      ['Tue', /\b(tue|tues|tuesday)\b/ig],
      ['Mon', /\b(mon|monday)\b/ig],
      ['Wed', /\b(wed|wednesday)\b/ig],
      ['Fri', /\b(fri|friday)\b/ig],
      ['Sat', /\b(sat|saturday)\b/ig],
      ['Sun', /\b(sun|sunday)\b/ig]
    ];
    function normTime(h,m){
      h=String(h||'0').padStart(2,'0');
      m=String(m||'').trim();
      if(!m) m='00';
      m=m.padStart(2,'0');
      if(m.length>2) m=m.slice(0,2);
      return `${h}:${m}`;
    }
    function extractTimeRange(segment,lastRange){
      const s=(segment||'').replace(/[–—]/g,'-').replace(/\s+/g,' ');
      const m=s.match(/(\d{1,2})\s*h?\s*(\d{0,2})\s*-\s*(\d{1,2})\s*h?\s*(\d{0,2})/i);
      if(m){
        return {start:normTime(m[1],m[2]), end:normTime(m[3],m[4])};
      }
      return lastRange;
    }
    function extractDays(segment){
      const found=[];
      DAY_ALIASES.forEach(([key,rgx])=>{
        rgx.lastIndex=0;
        if(rgx.test(segment||'')) found.push(key);
      });
      return [...new Set(found)];
    }

    function parseClassSessions(c){
      let lastRange=null;
      const parts=String(c.time||'').split(';').map(x=>x.trim()).filter(Boolean);
      const sessions=[];
      parts.forEach(part=>{
        const range=extractTimeRange(part,lastRange);
        if(range) lastRange=range;
        const days=extractDays(part);
        if(range && days.length){
          days.forEach(day=>sessions.push({classId:c.id, className:c.name, teacher:c.teacher, ta:c.ta, students:c.students?.length||0, day, start:range.start, end:range.end, slot:`${range.start}-${range.end}`, raw:c.time, type:'regular'}));
        }
      });
      return sessions;
    }
    function sessionDateInCurrentWeek(s,wk=weekStartDate()){return isoDate(dayDateForWeek(s.day,wk))}

    function weekSessionsForUser(){
      normalizeClassOperations();
      const wk=weekStartDate(); const end=addDays(wk,6);
      const allowed=new Set(classesForUser().map(c=>c.id));
      const base=classesForUser().flatMap(c=>parseClassSessions(c).map(s=>({...s,date:sessionDateInCurrentWeek(s,wk),type:'regular'})).filter(s=>classSessionVisible(c,s.date)));
      const makeup=(db.classMakeupSessions||[]).filter(m=>allowed.has(m.classId)).filter(m=>{const d=parseISODate(m.date); return d>=wk && d<=end;}).map(m=>{const c=classById(m.classId); return {classId:c.id,className:c.name,teacher:c.teacher,ta:c.ta,students:c.students?.length||0,day:m.day,start:m.start,end:m.end,slot:`${m.start}-${m.end}`,date:m.date,type:'class_makeup',sourceSessionKey:m.sourceSessionKey,makeupId:m.id,reason:m.reason||''}});
      return [...base,...makeup];
    }
    function sessionsForClass(classId){
      normalizeClassOperations();
      const wk=weekStartDate(); const end=addDays(wk,6); const c=classById(classId);
      const base=parseClassSessions(c).map(s=>({...s,date:sessionDateInCurrentWeek(s,wk),type:'regular'})).filter(s=>classSessionVisible(c,s.date));
      const makeup=(db.classMakeupSessions||[]).filter(m=>m.classId===classId).filter(m=>{const d=parseISODate(m.date); return d>=wk && d<=end;}).map(m=>({classId:c.id,className:c.name,teacher:c.teacher,ta:c.ta,students:c.students?.length||0,day:m.day,start:m.start,end:m.end,slot:`${m.start}-${m.end}`,date:m.date,type:'class_makeup',sourceSessionKey:m.sourceSessionKey,makeupId:m.id,reason:m.reason||''}));
      return [...base,...makeup];
    }
    function defaultSessionKeyForClass(classId){const s=sessionsForClass(classId)[0]; return s?sessionKeyFor(s):''}
    function sessionSelectOptions(classId,selected=''){
      return sessionsForClass(classId).map(s=>{const k=sessionKeyFor(s);return `<option value="${k}" ${k===selected?'selected':''}>${dayNameFromKey(s.day)} • ${s.start} - ${s.end}</option>`}).join('');
    }
    function switchMakeupSession(classId,key){openScheduleMakeup(classId,key)}
    function sortedWeekSlots(sessions){
      return [...new Set(sessions.map(s=>s.slot))].sort((a,b)=>a.localeCompare(b, 'vi'));
    }

    const CLASS_TIME_SLOTS = [
      {label:'09:00 - 10:30', start:'09:00', end:'10:30'},
      {label:'15:30 - 17:00', start:'15:30', end:'17:00'},
      {label:'16:30 - 18:00', start:'16:30', end:'18:00'},
      {label:'17:00 - 18:30', start:'17:00', end:'18:30'},
      {label:'17:30 - 19:00', start:'17:30', end:'19:00'},
      {label:'18:00 - 19:30', start:'18:00', end:'19:30'},
      {label:'18:30 - 20:00', start:'18:30', end:'20:00'}
    ];
    function isoDate(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
    function parseISODate(v){const [y,m,d]=String(v).split('-').map(Number);return new Date(y,m-1,d)}
    function mondayOf(d){const x=new Date(d); const day=x.getDay()||7; x.setDate(x.getDate()-day+1); x.setHours(0,0,0,0); return x}
    function addDays(d,n){const x=new Date(d); x.setDate(x.getDate()+n); return x}
    function weekStartDate(){db.settings.weekStart ||= isoDate(mondayOf(new Date())); return parseISODate(db.settings.weekStart)}
    function setWeekStart(v){db.settings.weekStart=isoDate(mondayOf(parseISODate(v))); save(); render()}
    function shiftWeek(n){db.settings.weekStart=isoDate(addDays(weekStartDate(),n*7)); save(); render()}
    function formatVNDate(d){return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`}
    function weekLabel(){const m=weekStartDate(); return `${formatVNDate(m)} - ${formatVNDate(addDays(m,6))}/${addDays(m,6).getFullYear()}`}
    function dayDateFor(dayKey){const idx=WEEK_DAYS.findIndex(d=>d.key===dayKey); return addDays(weekStartDate(), idx<0?0:idx)}

    function dateTimeForSession(s,field){
      const [hh,mm]=String(s[field]||'00:00').split(':').map(Number);
      const d=s.date?parseISODate(s.date):dayDateFor(s.day); d.setHours(hh||0,mm||0,0,0); return d;
    }


    function sessionStatus(s){
      const key=sessionKeyFor(s);
      if(isSessionCancelled(key)) return {key:'cancelled',label:'Nghỉ'};
      const now=new Date(), start=dateTimeForSession(s,'start'), end=dateTimeForSession(s,'end');
      if(s.type==='class_makeup'){
        if(now < start) return {key:'todo',label:'Dạy bù'};
        if(now >= start && now <= end) return {key:'live',label:'Đang dạy bù'};
        return {key:'done',label:'Đã dạy bù'};
      }
      if(now < start) return {key:'todo',label:'Chưa dạy'};
      if(now >= start && now <= end) return {key:'live',label:'Đang dạy'};
      return {key:'done',label:'Đã dạy'};
    }

    function sameDate(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
    function isTodayDayKey(dayKey){return sameDate(dayDateFor(dayKey), new Date())}
    function realtimeText(){
      const now=new Date();
      return now.toLocaleString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }

    function scheduleCounts(){
      const sessions=weekSessionsForUser();
      return sessions.reduce((acc,s)=>{const k=sessionStatus(s).key; acc[k]=(acc[k]||0)+1; return acc},{done:0,live:0,todo:0,cancelled:0});
    }

    function dayNameFromKey(k){return (WEEK_DAYS.find(d=>d.key===k)||{}).label||k}
    function timeSlotByValue(v){return CLASS_TIME_SLOTS.find(x=>`${x.start}-${x.end}`===v)||CLASS_TIME_SLOTS[3]}
    function buildClassTimeFromForm(){
      const count=Number(document.getElementById('newSessionCount')?.value||1);
      const sessions=[];
      for(let i=1;i<=count;i++){
        const day=document.getElementById(`newDay${i}`)?.value || 'Mon';
        const slot=timeSlotByValue(document.getElementById(`newSlot${i}`)?.value || '17:00-18:30');
        sessions.push(`${slot.start.replace(':','h')} - ${slot.end.replace(':','h')} ${day}`);

      return sessions.join('; ');
    }

function teacherRoleValue(t){return t.roles?.includes('admin')?'admin':t.roles?.includes('manager')?'manager':'teacher'}
    function teacherRoleLabel(t){const v=teacherRoleValue(t); return v==='admin'?'Admin':v==='manager'?'Quản lí':'Giáo viên'}
    function teacherRoleClasses(t){const v=teacherRoleValue(t); return v==='admin'?'red':v==='manager'?'blue':'green'}
    function classesOfTeacher(t){return db.classes.filter(c=>c.teacherId===t.id || c.taId===t.id || c.teacher===t.name || c.ta===t.name)}

    function roleChoiceMarkup(active='teacher',prefix='teacherRoleChoice',allowAdmin=isAdmin()){
      const roles=[
        ['teacher','👩‍🏫','Giáo viên','Điểm danh, xem lớp được phân công, thư viện và đánh giá học sinh.'],
        ['manager','🛡️','Quản lí','Quản lý lớp, lịch, học bù, học phí, giáo viên và dữ liệu vận hành.'],
        ['admin','👑','Admin','Toàn quyền: cài đặt, phân quyền, tạo tài khoản và quản trị hệ thống.']
      ].filter(r=>allowAdmin || r[0]!=='admin');
      return `<div class="teacherPermGrid">${roles.map(r=>`<div class="roleChoice ${active===r[0]?'active':''}" onclick="selectTeacherRole('${prefix}','${r[0]}')"><input type="radio" name="${prefix}" value="${r[0]}" ${active===r[0]?'checked':''} style="display:none"><b>${r[1]} ${r[2]}</b><small>${r[3]}</small></div>`).join('')}</div>`
    }
    function selectTeacherRole(name,value){
      document.querySelectorAll(`input[name="${name}"]`).forEach(i=>{i.checked=i.value===value});
      document.querySelectorAll(`input[name="${name}"]`).forEach(i=>i.closest('.roleChoice')?.classList.toggle('active',i.checked));
    }
    function selectedTeacherRole(name,def='teacher'){
      return document.querySelector(`input[name="${name}"]:checked`)?.value || def;
    }

    function teacherRoleLegend(){
      return `<div class="teacherRoleLegend">
        <div class="miniRole"><b>👩‍🏫 Giáo viên</b>Chỉ thấy lớp được gán. Không thấy học phí và không quản lý tài khoản.</div>
        <div class="miniRole"><b>🛡️ Quản lí</b>Thấy toàn bộ dữ liệu vận hành, học phí, lịch, điểm danh và giáo viên.</div>
        <div class="miniRole"><b>👑 Admin</b>Toàn quyền, bao gồm cài đặt hệ thống và phân quyền cấp cao.</div>
      </div>`
    }

    function teachersPage(){
      if(!(isAdmin()||isManager())) return `<div class="blockedBox"><h2>🔒 Không có quyền truy cập</h2></div>`;
      const rows=[...db.teachers].sort((a,b)=>a.name.localeCompare(b.name,'vi'));
      const managerCount=rows.filter(t=>t.roles?.includes('manager')).length;
      const adminCount=rows.filter(t=>t.roles?.includes('admin')).length;
      return `<div class="screenTitle"><div><h1>Giáo viên</h1><p>Quản lý thông tin, phân quyền, tài khoản đăng nhập và lớp dạy.</p></div><button class="btn primary" onclick="openTeacherModal()">+ Tạo giáo viên</button></div>
      ${teacherRoleLegend()}
      <div class="statGrid"><div class="stat"><div class="statIcon redgrad">👩‍🏫</div><div><h3>Tổng giáo viên</h3><strong>${rows.length}</strong><small>đang có</small></div></div><div class="stat"><div class="statIcon bluegrad">🛡️</div><div><h3>Quản lí</h3><strong>${managerCount}</strong><small>có quyền vận hành</small></div></div><div class="stat"><div class="statIcon greengrad">👑</div><div><h3>Admin</h3><strong>${adminCount}</strong><small>toàn quyền</small></div></div></div>
      <div class="grid3">${rows.map((t,i)=>teacherCard(t,i)).join('')}</div>`
    }

    function teacherCard(t,i){
      const cls=classesOfTeacher(t);
      const active=t.status!=='inactive';
      return `<div class="teacherCard" style="--i:${i}" onclick="openTeacherDetail('${t.id}')"><div class="teacherTop"><div class="teacherTopLeft"><div class="teacherAvatar">${(t.name||'T').split(' ').slice(-1)[0][0]||'T'}</div><div><h3 style="margin:0">${t.name}</h3><div class="mini">${t.phone||'Chưa có SĐT'}${t.email?` • ${t.email}`:''}</div></div></div><span class="pill ${teacherRoleClasses(t)}">${teacherRoleLabel(t)}</span></div>
      <div class="teacherMeta"><span class="pill gray">${cls.length} lớp</span><span class="pill ${active?'green':'gray'}">${active?'Đang hoạt động':'Tạm khóa'}</span></div>
      <div class="teacherClassList">${cls.length?cls.slice(0,8).map(c=>`<span class="sessionTag">${c.name}</span>`).join(''):'<span class="mini">Chưa được gán lớp</span>'}</div></div>`
    }

      modal(`<div class="modalHead"><h2>+ Tạo tài khoản giáo viên</h2><button class="close" onclick="closeModal()">×</button></div>
      <div class="teacherDetailHeader"><div class="teacherAvatar">+</div><div><h3 style="margin:0">Tạo giáo viên / quản lí mới</h3><p class="mini">Hệ thống sẽ tạo tài khoản đăng nhập thật và mật khẩu tạm 6 số. Người dùng sẽ phải đổi mật khẩu sau khi đăng nhập.</p></div></div>
      <div class="formGrid"><label>Họ tên<input id="teacherName" class="input" placeholder="VD: Ms Linh"></label><label>Số điện thoại / tài khoản<input id="teacherPhone" class="input" placeholder="VD: 0987654321"></label><label>Email<input id="teacherEmail" class="input" placeholder="tuỳ chọn"></label><label>Trạng thái<input class="input" value="Hoạt động" disabled></label></div>
      <div class="teacherPermPanel"><b>Phân quyền</b>${roleChoiceMarkup('teacher','teacherRoleChoice',isAdmin())}</div>
      <div style="text-align:right;margin-top:18px"><button class="btn ghost" onclick="closeModal()">Hủy</button> <button class="btn primary" onclick="saveTeacherFromModal()">Tạo tài khoản</button></div>`)
    }

    async function saveTeacherFromModal(){
      const name=(document.getElementById('teacherName')?.value||'').trim();
      const phone=normalizePhone(document.getElementById('teacherPhone')?.value||'');
      const email=(document.getElementById('teacherEmail')?.value||'').trim();
      let role=selectedTeacherRole('teacherRoleChoice','teacher');
      if(!isAdmin() && role==='admin') role='manager';
      if(!name || !phone){toast('Nhập đủ tên và số điện thoại');return}
      try{
        const data=await officialFetch('/api/teachers',{method:'POST',body:JSON.stringify({name,phone,email,role})});
        db.teachers = db.teachers.filter(t=>t.id!==data.teacher.id);
        db.teachers.push(data.teacher);
        save(); route='teachers'; saveUser(); render();
        showTempPasswordModal('Đã tạo tài khoản',data.teacher.phone,data.tempPassword,'render');
      }catch(e){toast(e.message||'Không tạo được giáo viên')}
    }

    function openTeacherDetail(id){
      if(!(isAdmin()||isManager())) return;
      const t=teacherById(id); if(!t?.id) return;
      const cls=classesOfTeacher(t);
      const role=teacherRoleValue(t);
      const classOptions=sortClassesByGrade(db.classes).filter(c=>c.teacherId!==t.id).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
      modal(`<div class="modalHead"><h2>Thông tin giáo viên</h2><button class="close" onclick="closeModal()">×</button></div>
      <div class="teacherDetailHeader"><div class="teacherAvatar">${(t.name||'T').split(' ').slice(-1)[0][0]||'T'}</div><div><h3 style="margin:0">${t.name}</h3><p class="mini">Tài khoản: <b>${t.phone||'-'}</b></p><span class="pill ${teacherRoleClasses(t)}">${teacherRoleLabel(t)}</span></div></div>
      <div class="teacherPopupGrid"><label>Họ tên<input id="editTeacherName" class="input" value="${h(t.name||'')}"></label><label>Số điện thoại / tài khoản<input id="editTeacherPhone" class="input" value="${h(t.phone||'')}"></label><label>Email<input id="editTeacherEmail" class="input" value="${h(t.email||'')}"></label><label>Trạng thái<select id="editTeacherStatus" class="input"><option value="active" ${t.status!=='inactive'?'selected':''}>Đang hoạt động</option><option value="inactive" ${t.status==='inactive'?'selected':''}>Tạm khóa</option></select></label></div>
      <div class="teacherPermPanel"><b>Phân quyền</b>${roleChoiceMarkup(role,'editTeacherRoleChoice',isAdmin())}</div>
      <div class="teacherClassBox"><b>Lớp đang phụ trách</b>${cls.length?cls.map(c=>`<div class="teacherClassRow"><span><b>${c.name}</b><span class="mini"> • ${c.time||'Chưa có lịch'}</span></span><button class="btn ghost miniCardBtn" onclick="removeTeacherFromClass('${t.id}','${c.id}')">Bỏ gán</button></div>`).join(''):'<div class="mini" style="margin-top:8px">Chưa được gán lớp</div>'}
      <div class="teacherAssignBox"><label>Gán thêm lớp<select id="teacherAssignClass" class="input"><option value="">-- Chọn lớp --</option>${classOptions}</select></label><button class="btn primary" onclick="const v=document.getElementById('teacherAssignClass').value;if(v)assignTeacherToClass('${t.id}',v)">Gán lớp</button></div></div>
      <div style="text-align:right;margin-top:18px"><button class="btn ghost" onclick="closeModal()">Đóng</button> <button class="btn ghost" onclick="resetTeacherPassword('${t.id}')">Reset mật khẩu</button> <button class="btn ghost dangerMini" onclick="deleteTeacher('${t.id}')">Xóa giáo viên</button> <button class="btn primary" onclick="saveTeacherDetail('${t.id}')">Lưu thông tin</button></div>`)
    }

    async function saveTeacherDetail(id){
      if(!(isAdmin()||isManager())) return;
      const t=teacherById(id); if(!t?.id) return;
      const name=(document.getElementById('editTeacherName')?.value||'').trim();
      const phone=normalizePhone(document.getElementById('editTeacherPhone')?.value||'');
      const email=(document.getElementById('editTeacherEmail')?.value||'').trim();
      const status=document.getElementById('editTeacherStatus')?.value||'active';
      let role=selectedTeacherRole('editTeacherRoleChoice',teacherRoleValue(t));
      if(!isAdmin() && role==='admin') role='manager';
      if(!name || !phone){toast('Nhập đủ tên và số điện thoại');return}
      try{
        const data=await officialFetch('/api/teachers',{method:'PATCH',body:JSON.stringify({id,name,phone,email,status,role})});
        db.teachers=db.teachers.map(x=>x.id===id?data.teacher:x);
        db.classes.forEach(c=>{if(c.teacherId===id){c.teacher=data.teacher.name}});
        save(); toast('Đã lưu giáo viên và phân quyền'); openTeacherDetail(id);
      }catch(e){toast(e.message||'Không lưu được giáo viên')}
    }

    async function resetTeacherPassword(teacherId){
      const t=teacherById(teacherId); if(!t?.id) return;
      try{
        const data=await officialFetch(`/api/teachers/${teacherId}/reset-password`,{method:'POST',body:'{}'});
        showTempPasswordModal('Đã reset mật khẩu',data.phone||t.phone,data.tempPassword,'render');
      }catch(e){toast(e.message||'Không reset được mật khẩu')}
    }

    async function assignTeacherToClass(teacherId,classId){
      if(!(isAdmin()||isManager())) return;
      const t=teacherById(teacherId), c=classById(classId);
      if(!t?.id || !c?.id) return;
      try{
        await officialFetch(`/api/teachers/${teacherId}/classes`,{method:'POST',body:JSON.stringify({classId,action:'assign'})});
        c.teacher=t.name; c.teacherId=t.id; save(); toast(`Đã gán ${t.name} vào ${c.name}`); openTeacherDetail(teacherId);
      }catch(e){toast(e.message||'Không gán được lớp')}
    }

    async function removeTeacherFromClass(teacherId,classId){
      if(!(isAdmin()||isManager())) return;
      const c=classById(classId); const t=teacherById(teacherId); if(!c?.id||!t?.id) return;
      try{
        await officialFetch(`/api/teachers/${teacherId}/classes`,{method:'POST',body:JSON.stringify({classId,action:'remove'})});
        if(c.teacherId===teacherId || c.teacher===t.name){c.teacher=''; c.teacherId=null}
        save(); toast('Đã bỏ gán lớp'); openTeacherDetail(teacherId);
      }catch(e){toast(e.message||'Không bỏ gán được lớp')}
    }


    async function deleteTeacher(teacherId){
      if(!(isAdmin()||isManager())) return;
      const t=teacherById(teacherId); if(!t?.id) return;
      const cls=classesOfTeacher(t);
      const ok=confirm(`Xóa giáo viên ${t.name}?\n\nTài khoản đăng nhập sẽ bị xóa. ${cls.length} lớp đang gán sẽ được bỏ giáo viên.`);
      if(!ok) return;
      try{
        await officialFetch('/api/teachers',{method:'DELETE',body:JSON.stringify({id:teacherId})});
        db.teachers=db.teachers.filter(x=>x.id!==teacherId);
        db.users=(db.users||[]).filter(u=>normalizePhone(u.phone)!==normalizePhone(t.phone));
        db.classes.forEach(c=>{if(c.teacherId===teacherId || c.teacher===t.name){c.teacher=''; c.teacherId=null}});
        save(); closeModal(); toast('Đã xóa giáo viên và tài khoản liên quan'); render();
      }catch(e){toast(e.message||'Không xóa được giáo viên')}
    }

    function suggestPromotedClassName(name){
      const raw=String(name||'').trim();
      let m=raw.match(/^G\s*(\d+)\s*\.(\d+)/i);
      if(m) return `G${Number(m[1])+1}.${m[2]}`;
      m=raw.match(/^(\d+)\s*\.(\d+)/);
      if(m) return `G${Number(m[1])+1}.${m[2]}`;
      if(/^GK/i.test(raw)) return 'G1.1';
      return raw?`${raw} - New`:'G4.1';
    }
    function buildPromoteClassTimeFromForm(){
      const count=Number(document.getElementById('promoteSessionCount')?.value||1);
      const sessions=[];
      for(let i=1;i<=count;i++){
        const day=document.getElementById(`promoteDay${i}`)?.value || 'Mon';
        const slot=timeSlotByValue(document.getElementById(`promoteSlot${i}`)?.value || '17:00-18:30');
        sessions.push(`${slot.start.replace(':','h')} - ${slot.end.replace(':','h')} ${day}`);
      }
      return sessions.join('; ');
    }
    function firstUpcomingDateFromPromoteForm(){
      const count=Number(document.getElementById('promoteSessionCount')?.value||1);
      let best=null;
      for(let i=1;i<=count;i++){
        const day=document.getElementById(`promoteDay${i}`)?.value || 'Mon';
        const d=nextDateForDay(day);
        if(!best || d<best) best=d;
      }
      return best || new Date();
    }

    function savePromotedClass(sourceClassId){
      if(!(isAdmin()||isManager())) return;

      const name=(document.getElementById('promoteClassName')?.value||'').trim();

        return {...st,id:`${sid}_${newId}_${i}`,previousStudentId:sid,previousClassId:old.id,historyNote:`Chuyển từ ${old.name}`};
      }).filter(s=>s.name);
      db.classes.push({id:newId,name,teacher,teacherId:teacherRec.id||null,ta,time,month:'',students:newStudents,status:'active',startDate,endDate:'',createdAt:new Date().toLocaleString('vi-VN'),promotedFrom:old.id});
      old.status='ended';
      old.endDate=isoDate(addDays(parseISODate(startDate),-1));
      old.promotedTo=newId;
      old.promotedAt=new Date().toLocaleString('vi-VN');
      db.evaluations ||= [];
      newStudents.forEach(st=>db.evaluations.push({studentId:st.id,classId:newId,month:'06/2026',scores:{Listening:3,Speaking:3,Reading:3,Writing:3,Vocabulary:3,Participation:3,Homework:3},status:'draft',comment:`Học sinh chuyển lên từ ${old.name}.`,strengths:'Đã hoàn thành kỳ trước.',improvements:'Tiếp tục theo dõi trong lớp mới.',suggestion:'Phụ huynh duy trì thói quen ôn bài hằng tuần.'}));
      (db.users||[]).forEach(u=>{
        if(Array.isArray(u.children)){
          selected.forEach(sid=>{
            const ns=newStudents.find(x=>x.previousStudentId===sid);
            if(ns && u.children.includes(sid) && !u.children.includes(ns.id)) u.children.push(ns.id);
          });
        }
      });
      save(); closeModal(); route='classes'; saveUser(); render(); toast(`Đã chuyển ${old.name} sang ${name}`);
    }

    function weeklyTable(sessions,slots){
      if(!slots.length) return '<div class="empty">Chưa có dữ liệu lịch học.</div>';
      return `<div class="timetableShell"><table class="timetable"><thead><tr><th class="timeCol">Khung giờ</th>${WEEK_DAYS.map(d=>`<th class="${isTodayDayKey(d.key)?'todayColumn':''}">${d.label}<div class="mini">${formatVNDate(dayDateFor(d.key))}${isTodayDayKey(d.key)?' • Hôm nay':''}</div></th>`).join('')}</tr></thead><tbody>${slots.map((slot,ri)=>`<tr><td class="timeCol">${slot.replace('-', ' - ')}</td>${WEEK_DAYS.map(d=>{const daySessions=sessions.filter(s=>s.slot===slot&&s.day===d.key); return `<td class="scheduleCell ${isTodayDayKey(d.key)?'todayColumn':''}">${daySessions.length?daySessions.map((s,i)=>lessonCard(s,ri+i)).join(''):'<div class="emptySlot">Trống</div>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
    }






    function lessonCard(s,i){
      const key=sessionKeyFor(s);
      const st=sessionStatus(s);
      const plans=makeupCountForSession(key);
      const absent=absentCountForSession(key);
      const isMakeup=s.type==='class_makeup';
      const statusPill=`<span class="statusDot ${st.key}">${st.label}</span>`;
      let bodyAction='';
      let extraClass=isMakeup?'classMakeupCard':'';
      if(st.key==='cancelled'){
        extraClass='cancelledCard';
        const rec=sessionCancelRecord(key)||{};
        bodyAction=`<div class="strictStateLine"><span class="pill gray">${rec.reason||'Nghỉ buổi học'}</span>${canScheduleMakeup()?`<button class="btn primary" onclick="openClassMakeupModal('${key}')">Xếp dạy bù</button>`:''}</div>`;
      }else if(st.key==='done'){
        extraClass+=' strictDone';
        bodyAction=`<div class="strictStateLine">${absent>0?`<button class="absenceBtn" onclick="openAbsencePopup('${key}')">Vắng: ${absent}</button>`:`<span class="pill green">Vắng: 0</span>`}</div>`;
      }else if(st.key==='live'){
        extraClass+=' strictLive';
        bodyAction=`<div class="strictStateLine"><span class="statusDot live">${st.label}</span></div>`;

      const sourceSessionKey=''; const absenceIdValue=absenceId(studentId,sourceSessionKey||`${sourceClassId}|legacy`);

    async function scheduleMakeupFromAbsence(absenceIdValue,studentId,sourceClassId,sourceSessionKey,targetClassId,targetSessionKey=''){
      db.makeupPlans ||= [];
      normalizeMakeupPlans(); ensureAbsenceRecords();
      if(!targetSessionKey){toast('Bạn cần chọn đúng buổi học bù trước');return}
      const targetSession=sessionObjectFromKey(targetSessionKey);
      if(!targetSession || sessionStatus(targetSession).key!=='todo'){toast('Chỉ được xếp vào lớp chưa dạy');return}
      if(!sameGradeDifferentClass(sourceClassId,targetClassId)){toast('Chỉ được xếp học bù cùng khối nhưng khác lớp');return}
      const capacity=db.settings.capacity||15;
      if(totalRosterCountForSession(targetClassId,targetSessionKey)>=capacity){toast(`Buổi này đã đủ ${capacity} học sinh`);return}
      if(plannedMakeupsForSession(targetSessionKey).some(p=>p.studentId===studentId)){toast('Học sinh đã có trong buổi học bù này');return}
      const rec=db.absenceRecords.find(a=>a.id===absenceIdValue);
      if(!rec){toast('Không tìm thấy lượt vắng');return}
      if(absenceRecordStatus(absenceIdValue)==='scheduled'){toast('Lượt vắng này đã được xếp học bù');return}
      try{
        const data=await officialFetch('/api/makeup/plans',{method:'POST',body:JSON.stringify({id:'mk_'+Date.now(),absenceId:absenceIdValue,studentId,sourceClassId,sourceSessionKey:sourceSessionKey||null,targetClassId,targetSessionKey})});
        db.makeupPlans.push(data.plan);
        rec.status='scheduled';
        save(); toast('Đã xếp học bù vào đúng buổi đã chọn'); openScheduleMakeup(targetClassId,targetSessionKey);
      }catch(e){toast(e.message||'Không xếp được học bù')}
    }

    function homeworkTypeOptions(){
      return [
        ['listen_tick','Listening - Listen and tick'],
        ['listen_complete','Listening - Listen and complete'],
        ['listen_number','Listening - Listen and number'],
        ['listen_match','Listening - Listen and match'],
        ['reading_choose','Reading - Choose the correct answer'],
        ['reading_complete','Reading - Look, read and complete'],
        ['reading_match','Reading - Read and match'],
        ['reading_tick_picture','Reading - Tick the correct picture'],
        ['writing_order','Writing - Put the words in order'],
        ['writing_complete','Writing - Complete the sentences'],
        ['writing_missing_letter','Writing - Write the missing letter'],
        ['upload_file','Upload photo/file']
      ];
    }
    function homeworkTypeLabel(t){return (homeworkTypeOptions().find(x=>x[0]===t)||[])[1]||t||'Thư viện bài tập'}
    function assignmentQuestions(a){
      if(a.questions?.length) return a.questions;
      const type=a.type || (a.skill==='Listening'?'listen_tick':a.skill==='Reading'?'reading_choose':a.skill==='Writing'?'writing_complete':'upload_file');
      if(type==='listen_tick') return [{q:'Listen and tick the correct answer.',answer:'B'},{q:'Listen and choose True or False.',answer:'True'},{q:'Listen and tick the picture you hear.',answer:'A'}];
      if(type==='listen_complete') return [{q:'I have a _____.',answer:'book'},{q:'She is in the _____.',answer:'classroom'}];
      if(type==='reading_choose') return [{q:'Choose the correct answer: This is my school.',answer:'school'},{q:'What color is the bag?',answer:'red'}];
      if(type==='reading_complete') return [{q:'Look, read and complete: This is my _____.',answer:'teacher'},{q:'I can see a _____.',answer:'cat'}];
      if(type==='writing_order') return [{q:'Put the words in order: like / I / English',answer:'I like English'},{q:'is / This / pen / my',answer:'This is my pen'}];
      if(type==='writing_missing_letter') return [{q:'Write the missing letter: b_ok',answer:'o'},{q:'c_t',answer:'a'}];
      return [{q:'Upload photo/file of your homework.',answer:''}];
    }
    function assignmentAutoGrade(a){return a.autoGrade!==false && (a.type||'').indexOf('upload')<0 && a.skill!=='Speaking'}
    function homeworkStatusPill(status,gradeStatus){
      if(gradeStatus==='graded') return '<span class="pill green">Đã chấm</span>';
      if(status==='submitted') return '<span class="pill yellow">Đã nộp</span>';
      if(status==='missing') return '<span class="pill red">Chưa nộp</span>';
      return '<span class="pill blue">Đang làm</span>';
    }
    function ensureHomework(){
      db.assignments ||= []; db.submissions ||= [];
      db.assignments.forEach(a=>{a.type ||= a.skill==='Listening'?'listen_tick':a.skill==='Reading'?'reading_choose':a.skill==='Writing'?'writing_complete':a.skill==='Speaking'?'upload_file':'reading_choose'; a.totalScore ||= 100;});
    }

    function submissionById(id){return db.submissions.find(s=>s.id===id)||{}}

    function submitHomework(assignmentId,studentId){
      const a=assignmentById(assignmentId);
      let s=db.submissions.find(x=>x.assignmentId===assignmentId&&x.studentId===studentId);
      if(!s){s={id:'sub_'+assignmentId+'_'+studentId,assignmentId,studentId,classId:a.classId}; db.submissions.push(s)}
      s.status='submitted'; s.submittedAt=new Date().toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      if(assignmentAutoGrade(a)){s.gradeStatus='graded'; s.score=88; s.teacherComment='Hệ thống đã tự chấm phần câu hỏi ngắn.'}
      else{s.gradeStatus='need_grade'; s.score=null; s.teacherComment='Chờ giáo viên chấm.'}

      db.exerciseLibrary ||= [];

      ensureExerciseLibrary();
      return [...new Set((db.exerciseLibrary||[]).filter(x=>x.type===type).map(x=>x[field]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'vi',{numeric:true}));
    }
    function setLibraryFilter(field,value){
      ensureExerciseLibrary();
      if(field==='level') db.libraryLevel=value;
      if(field==='skill') db.librarySkill=value;

      save(); render();

    function filterSelect(label,field,current,values){

    function activeLibraryFiltersText(){
      const chips=[];

    function libraryItems(type=normalizeLibraryTab()){
      ensureExerciseLibrary();
      const q=String(db.libraryQ||'').toLowerCase().trim();
      const level=db.libraryLevel||'all';
      const skill=db.librarySkill||'all';
      const unit=db.libraryUnit||'all';
      return (db.exerciseLibrary||[])
        .filter(x=>x.type===type)
        .filter(x=>!q || [x.title,x.level,x.skill,x.unit,x.fileName,x.uploadedBy].join(' ').toLowerCase().includes(q))
        .filter(x=>level==='all' || x.level===level)
        .filter(x=>skill==='all' || x.skill===skill)
        .filter(x=>unit==='all' || x.unit===unit)
        .sort((a,b)=>String(b.uploadedAt||b.createdAt||'').localeCompare(String(a.uploadedAt||a.createdAt||''),'vi') || String(a.title).localeCompare(String(b.title),'vi'));
    }

    function libraryTypeLabel(t){return t==='audio'?'Audio':'Word'}

function canManageLibrary(){return isAdmin()||isManager()||isTeacher()}
    function canDeleteLibrary(){return isAdmin()||isManager()}
    function fileSizeLabel(bytes){
      const n=Number(bytes||0);
      if(!n) return 'Không rõ dung lượng';
      if(n<1024*1024) return `${Math.round(n/1024)} KB`;
      return `${(n/1024/1024).toFixed(n<10*1024*1024?1:0)} MB`;
    }
    function libraryDateLabel(v){
      if(!v) return '-';
      const d=new Date(v);
      if(Number.isNaN(d.getTime())) return v;
      return d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }
    function normalizeLibraryTab(){
      if(db.libraryTab==='pdf') db.libraryTab='word';
      db.libraryTab ||= 'word';
      return db.libraryTab;
    }

    function syncLibraryFileType(){
      const file=document.getElementById('libFile')?.files?.[0];
      if(!file) return;
      const name=file.name.toLowerCase();
      const type=/\.(doc|docx)$/i.test(name)||file.type.includes('wordprocessingml')||file.type==='application/msword'?'word':'audio';
      const typeEl=document.getElementById('libType'); if(typeEl) typeEl.value=type;
      const titleEl=document.getElementById('libTitle');
      if(titleEl && !titleEl.value) titleEl.value=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
    }

    async function saveLibraryItem(){
      const type=document.getElementById('libType')?.value||'word';
      const title=(document.getElementById('libTitle')?.value||'').trim();
      const level=(document.getElementById('libLevel')?.value||'').trim();
      const skill=document.getElementById('libSkill')?.value||'';
      const unit=(document.getElementById('libUnit')?.value||'').trim();
      const file=document.getElementById('libFile')?.files?.[0];
      const status=document.getElementById('libUploadStatus');
      if(!title){toast('Nhập tên tài liệu');return}
      if(!file){toast('Chọn file Word hoặc Audio');return}
      try{
        if(status) status.innerHTML='<div class="uploadProgressNote">Đang upload file lên Supabase Storage...</div>';
        const fd=new FormData();
        fd.append('type',type); fd.append('title',title); fd.append('level',level||'All'); fd.append('skill',skill); fd.append('unit',unit); fd.append('file',file);
        const res=await fetch('/api/library',{method:'POST',body:fd,credentials:'include'});
        const data=await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(data.error||'Upload lỗi');
        db.exerciseLibrary ||= [];
        db.exerciseLibrary.unshift(data.item);
        db.libraryTab=data.item.type;
        save(); closeModal(); render(); toast('Đã upload tài liệu thật');
      }catch(e){
        if(status) status.innerHTML='';
        toast(e.message||'Không upload được tài liệu');
      }
    }

    function openDeleteLibraryItem(id){
      const item=(db.exerciseLibrary||[]).find(x=>x.id===id); if(!item) return;
      modal(`<div class="modalHead"><h2>Xóa tài liệu</h2><button class="close" onclick="closeModal()">×</button></div>
      <div class="dangerBox"><b>${h(item.title)}</b><span>Thao tác này sẽ xóa tài liệu khỏi thư viện và xóa file trong Storage. Chỉ Admin/Quản lí có quyền xóa.</span></div>
      <div style="text-align:right;margin-top:18px"><button class="btn ghost" onclick="closeModal()">Hủy</button> <button class="btn dangerAction" onclick="deleteLibraryItem('${id}')">Xóa tài liệu</button></div>`)
    }

    async function deleteLibraryItem(id){
      try{
        await officialFetch(`/api/library/${encodeURIComponent(id)}`,{method:'DELETE',body:'{}'});
        db.exerciseLibrary=(db.exerciseLibrary||[]).filter(x=>x.id!==id);
        save(); closeModal(); render(); toast('Đã xóa tài liệu');
      }catch(e){toast(e.message||'Không xóa được tài liệu')}
    }

    function monthScoreData(studentId){
      const ev=ensureEvaluation(studentId);
      const base=evalAverage(ev)||3.2;
      const months=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6'];
      return months.map((m,i)=>({month:m,score:Math.min(5,Math.max(1,+(base-0.55+i*0.16+((i%2)*0.08)).toFixed(1)))}));
    }
    function weeklyEvaluationData(studentId){
      const ev=ensureEvaluation(studentId);
      const avg=evalAverage(ev)||3.5;
      return [
        {week:'Tuần 1',focus:'Ổn định nề nếp học',score:Math.max(1,+(avg-.3).toFixed(1)),note:'Bé tham gia lớp tốt, cần chủ động phát biểu hơn.'},
        {week:'Tuần 2',focus:'Vocabulary & Listening',score:Math.max(1,+(avg-.1).toFixed(1)),note:'Từ vựng tiến bộ, nghe hiểu nội dung chính tốt hơn.'},
        {week:'Tuần 3',focus:'Speaking practice',score:Math.min(5,+(avg+.1).toFixed(1)),note:'Bé trả lời tốt hơn nhưng cần nói to, rõ và đủ câu.'},
        {week:'Tuần 4',focus:'Review & Homework',score:Math.min(5,+(avg+.25).toFixed(1)),note:'Hoàn thành bài tập tốt, phụ huynh duy trì luyện nghe tại nhà.'}
      ];
    }

    async function saveEvaluation(studentId,status='draft',reopen=true){
      const ev=ensureEvaluation(studentId);
      ['comment','strengths','improvements','suggestion'].forEach(k=>{
        const el=document.getElementById(`ev_${k}_${studentId}`);
        if(el) ev[k]=el.value.trim();
      });
      ev.status=status; ev.updatedAt=new Date().toLocaleString('vi-VN'); save();
      try{
        const data=await officialFetch('/api/evaluations',{method:'POST',body:JSON.stringify({
          studentId,
          monthKey:evaluationMonthKey(),
          status,
          scores:ev.scores,
          comment:ev.comment,
          strengths:ev.strengths,
          improvements:ev.improvements,
          suggestion:ev.suggestion
        })});
        db.evaluations=db.evaluations.filter(e=>!(e.studentId===studentId && normalizeEvaluationMonthValue(e.monthKey||e.month)===evaluationMonthKey()));
        db.evaluations.push(data.item);
        save();
        toast(status==='published'?'Đã chốt/gửi đánh giá':'Đã lưu nháp đánh giá');
        if(reopen) openEvalModal(studentId,false);
        else render();
      }catch(e){toast(e.message||'Không lưu được đánh giá')}
    }

      return `<div class="panel"><div class="panelHead"><div><h2>Production & Backup</h2><div class="mini">Kiểm tra cấu hình, Storage, bảng dữ liệu và xuất backup JSON.</div></div><span class="pill blue">V9</span></div>
        <div class="prodGrid">
          <div class="prodCard"><b>Kiểm tra hệ thống</b><span class="mini">Kiểm tra env, Supabase, các bảng bắt buộc và bucket lưu bài tập.</span><button class="btn primary" onclick="runHealthCheck()">Chạy kiểm tra</button></div>
          <div class="prodCard"><b>Backup dữ liệu</b><span class="mini">Xuất toàn bộ dữ liệu chính thành file JSON để lưu ngoài Supabase.</span><button class="btn ghost" onclick="downloadBackup()">Tải backup JSON</button></div>
          <div class="prodCard"><b>Dọn phiên hết hạn</b><span class="mini">Xóa session đã hết hạn để hệ thống gọn hơn. Không ảnh hưởng dữ liệu học.</span><button class="btn ghost" onclick="clearExpiredSessions()">Dọn session</button></div>
        </div>
        <div id="prodStatus"></div>
      </div>`
    }
    function healthStatusRow(name,ok,desc=''){
      return `<div class="prodStatusRow ${ok?'ok':'bad'}"><div><b>${h(name)}</b>${desc?`<div class="mini">${h(desc)}</div>`:''}</div><span class="pill ${ok?'green':'red'}">${ok?'OK':'Lỗi'}</span></div>`
    }
    async function runHealthCheck(){
      const box=document.getElementById('prodStatus');
      if(box) box.innerHTML='<div class="uploadProgressNote">Đang kiểm tra hệ thống...</div>';
      try{
        const data=await officialFetch('/api/health');
        const rows=[];
        rows.push(healthStatusRow('Supabase URL',!!data.env?.NEXT_PUBLIC_SUPABASE_URL));
        rows.push(healthStatusRow('Service Role Key',!!data.env?.SUPABASE_SERVICE_ROLE_KEY));
        rows.push(healthStatusRow('Storage official-exercise-library',!!data.storage?.ok,data.storage?.error||'Bucket lưu Word/Audio'));
        (data.tables||[]).forEach(t=>rows.push(healthStatusRow(t.table,t.ok,t.ok?`${t.count} dòng`:t.error)));
        if(box) box.innerHTML=`<div class="prodStatusList">${rows.join('')}</div>`;
        toast(data.ok?'Hệ thống OK':'Có mục cần kiểm tra');
      }catch(e){
        if(box) box.innerHTML=`<div class="dangerBox"><b>Không kiểm tra được hệ thống</b><span>${h(e.message||'Lỗi không xác định')}</span></div>`;
        toast(e.message||'Không kiểm tra được hệ thống');
      }
    }
    function downloadBackup(){
      window.open('/api/backup/export','_blank');
      toast('Đang tải backup JSON');
    }
    async function clearExpiredSessions(){
      try{
        const data=await officialFetch('/api/maintenance/clear-expired-sessions',{method:'POST',body:'{}'});
        toast(`Đã dọn ${data.deleted||0} session hết hạn`);
      }catch(e){toast(e.message||'Không dọn được session')}
    }

function settingsPage(){
      if(!(isAdmin()||isManager())) return `<div class="screenTitle"><div><h1>Tài khoản</h1><p>Không có quyền quản lý tài khoản.</p></div></div>`;
      const rows=accountLinkedRows();
      return `<div class="screenTitle"><div><h1>${isAdmin()?'Cài đặt & tài khoản':'Quản lý tài khoản'}</h1><p>Tài khoản nội bộ được liên kết trực tiếp với danh sách giáo viên và nhân viên trung tâm.</p></div></div>
      ${isAdmin()?`<div class="panel" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
        <label>Đơn giá/buổi <input class="input" type="number" value="${db.settings.unitPrice||70000}" onchange="db.settings.unitPrice=+this.value;save();updateBackendSetting('tuition_per_session',this.value,'Đã cập nhật đơn giá')"></label>
        <label>Giới hạn học sinh/buổi <input class="input" type="number" value="${db.settings.capacity||15}" onchange="db.settings.capacity=+this.value;save();updateBackendSetting('session_capacity',this.value,'Đã cập nhật giới hạn sĩ số')"></label>
      </div>`:''}
      ${securityPasswordPanel()}${productionPanel()}
      <div class="panel accountTable"><div class="panelHead"><h2>Tài khoản giáo viên / nhân viên</h2><span class="pill red">${rows.length} tài khoản</span></div>
      <div class="accountLinkedGrid"><div class="accountLinkedRow head"><div>Tên</div><div>Tài khoản</div><div>Vai trò</div><div>Lớp</div><div>Thao tác</div></div>
      ${rows.map(r=>`<div class="accountLinkedRow"><div><b>${r.name}</b><div class="mini">${r.kind==='teacher'?'Liên kết giáo viên':'Tài khoản hệ thống'}</div></div><div>${r.phone||'-'}</div><div><span class="pill ${accountRoleClass(r.roles)}">${accountRoleLabel(r.roles)}</span></div><div>${r.classes?.length?`<span class="pill gray">${r.classes.length} lớp</span>`:'<span class="mini">Chưa gán lớp</span>'}</div><div class="accountActions">${r.kind==='teacher'?`<button class="btn ghost miniCardBtn" onclick="openTeacherDetail('${r.teacher.id}')">Chi tiết</button><button class="btn ghost miniCardBtn" onclick="resetTeacherPassword('${r.teacher.id}')">Reset</button><button class="btn ghost miniCardBtn dangerMini" onclick="deleteTeacher('${r.teacher.id}')">Xóa</button>`:(r.user?.id==='admin'?'<span class="mini">Tài khoản gốc</span>':`<button class="btn ghost miniCardBtn" onclick="resetUserPassword('${r.user.id}')">Reset</button>`)}</div></div>`).join('')}</div></div>`
    }

    function openImportClassesModal(){
      modal(`<div class="modalHead"><h2>Import lớp / học sinh</h2><button class="close" onclick="closeModal()">×</button></div>
      <div class="modalInfoGrid"><div><p><b>Mẫu file:</b> CSV hoặc Excel.</p><p>Các cột nên có: class_name, teacher_name, schedule_1_day, schedule_1_start, schedule_1_end, schedule_2_day, schedule_2_start, schedule_2_end, student_name, parent_phone, note.</p></div><div><a class="btn ghost" href="/import-template.xlsx" download="mau-import-lop-hoc.xlsx">Tải file mẫu Excel</a></div></div>
      <label>Chọn file<input id="classImportFile" class="input" type="file" accept=".xlsx,.xls,.csv"></label>
      <div style="text-align:right;margin-top:18px"><button class="btn ghost" onclick="closeModal()">Hủy</button> <button class="btn primary" onclick="uploadClassImport()">Import</button></div>`)
    }
    async function uploadClassImport(){
      const file=document.getElementById('classImportFile')?.files?.[0];
      if(!file){toast('Chọn file import');return}
      const fd=new FormData(); fd.append('file',file);
      try{
        const res=await fetch('/api/import/classes',{method:'POST',body:fd,credentials:'include'});
        const data=await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(data.error||'Import lỗi');
        await refreshOfficialClasses();
        closeModal(); route='classes'; saveUser(); render();
        toast(`Import xong: ${data.classCount} lớp, ${data.studentCount} học sinh`);
      }catch(e){toast(e.message||'Import lỗi')}
    }

    function openClassModal(){
      const dayOptions=WEEK_DAYS.map(d=>`<option value="${d.key}">${d.label}</option>`).join('');
      const slotOptions=CLASS_TIME_SLOTS.map(s=>`<option value="${s.start}-${s.end}">${s.label}</option>`).join('');
      modal(`<div class="modalHead"><h2>+ Thêm lớp mới</h2><button class="close" onclick="closeModal()">×</button></div>
      <div class="formGrid">
        <label>Tên lớp<input id="newClassName" class="input" value="G3.4" placeholder="VD: G3.4"></label>
        <label>Giáo viên<select id="newTeacher">${db.teachers.map(t=>`<option>${t.name}</option>`).join('')}</select></label>
        <label>Ngày bắt đầu<input id="newStartDate" class="input" type="date"></label>
        <label>Trợ giảng<input id="newTA" class="input" placeholder="VD: Ms Ánh"></label>
        <label>Số buổi/tuần<select id="newSessionCount" onchange="updateNewClassPreview()"><option value="1">1 buổi / tuần</option><option value="2" selected>2 buổi / tuần</option></select></label>
        <div></div>
        <div class="full sessionConfigurator">
          <h3>Buổi 1</h3>
          <div class="inline2"><label>Ngày học<select id="newDay1" onchange="updateNewClassPreview()">${dayOptions}</select></label><label>Khung giờ<select id="newSlot1" onchange="updateNewClassPreview()">${slotOptions}</select></label></div>
          <div class="session2Only">
            <h3 style="margin-top:14px">Buổi 2</h3>
            <div class="inline2"><label>Ngày học<select id="newDay2" onchange="updateNewClassPreview()">${dayOptions.replace('value="Wed"','value="Wed" selected')}</select></label><label>Khung giờ<select id="newSlot2" onchange="updateNewClassPreview()">${slotOptions}</select></label></div>
          </div>
          <div class="slotPreview"><b>Lịch học:</b> <span id="newClassPreview"></span></div>
        </div>
      </div>
      <div style="text-align:right;margin-top:18px"><button class="btn ghost" onclick="closeModal()">Hủy</button> <button class="btn primary" onclick="saveNewClassFromModal()">Tạo lớp</button></div>`);
      setTimeout(()=>{updateNewClassPreview(); const el=document.getElementById('newStartDate'); if(el&&!el.value) el.value=isoDate(firstUpcomingDateFromForm())},0);
    }


    async function saveNewClassFromModal(){
      const name=(document.getElementById('newClassName')?.value||'').trim();
      if(!name){toast('Nhập tên lớp');return}
      if(classNameExists(name)){toast('Tên lớp đã tồn tại. Vui lòng chọn tên khác.');return}
      const teacher=document.getElementById('newTeacher')?.value||'';
      const ta=(document.getElementById('newTA')?.value||'').trim();
      const startDate=document.getElementById('newStartDate')?.value || isoDate(firstUpcomingDateFromForm());
      try{
        const data=await officialFetch('/api/classes',{method:'POST',body:JSON.stringify({
          name,
          teacherName:teacher,
          assistantName:ta,
          startDate,
          schedules:schedulePayloadFromNewClassForm()
        })});
        db.classes.push(data.class);
        save(); closeModal(); route='classes'; saveUser(); render(); toast(`Đã tạo ${name}.`);
      }catch(e){toast(e.message||'Không tạo được lớp')}
    }

    function modal(html){modalBackdrop.innerHTML=`<div class="modal">${html}</div>`;modalBackdrop.classList.add('show')}
    function closeModal(){modalBackdrop.classList.remove('show')}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
    window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    ensureLifecycle();
    bootstrapOfficial();
    setInterval(()=>{ if(currentUser && route==='schedule' && !document.getElementById('modalBackdrop')?.classList.contains('show')) renderApp(); }, 30000);
  </script>
</body>
</html>
